services:
  comfyui:
    build:
      context: .
      dockerfile: docker/comfyui/Dockerfile
    image: comfymui-comfyui:latest
    container_name: comfymui-comfyui
    restart: unless-stopped
    ports:
      - "127.0.0.1:${COMFY_PORT:-8188}:8188"
    environment:
      - COMFY_PORT=8188
      - COMFY_EXTRA_ARGS=${COMFY_EXTRA_ARGS:---lowvram --reserve-vram 1 --preview-method auto}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      # Named volume for all persistent ComfyUI data (models, output, input, user, temp)
      - comfy-data:/data
      # Local models can also be selected as a download destination
      - ${HOST_MODELS_DIR:-E:/Models}:/host-models:rw
      # ComfyUI extra model paths configuration
      - ./docker/comfyui/extra_model_paths.yaml:/etc/comfyui/extra_model_paths.yaml:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8188/system_stats || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  comfymui:
    build:
      context: .
      dockerfile: docker/comfymui/Dockerfile
    image: comfymui-app:latest
    container_name: comfymui-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8189:8189"
    environment:
      - NODE_ENV=production
      - PORT=8189
      - HOST=0.0.0.0
      - COMFY_URL=http://comfyui:8188
      - COMFY_OUTPUT_DIR=/comfy-data/output
      - STATE_DB=/data/comfymui.db
      - THUMB_CACHE_DIR=/data/thumbnails
      - SCENARIO_AI_BASE_URL=${SCENARIO_AI_BASE_URL:-}
      - SCENARIO_AI_MODEL=${SCENARIO_AI_MODEL:-}
      - SCENARIO_AI_API_KEY=${SCENARIO_AI_API_KEY:-}
    volumes:
      # Named volume for ComfyMUI persistence (SQLite state DB & thumbnail cache)
      - comfymui-data:/data
      # Shared named volume to access ComfyUI's output directory with write permission for deletion
      - comfy-data:/comfy-data:rw
    depends_on:
      comfyui:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8189/api/state || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  persona:
    build:
      context: ../Persona
      dockerfile: Dockerfile
    image: persona-app:latest
    container_name: persona-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8190:8190"
    env_file:
      - path: ../Persona/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=8190
      - HOST=0.0.0.0
      - COMFY_URL=http://comfyui:8188
      - LORA_DIR=/comfy-data/models/loras
    volumes:
      # Named volume for Persona persistence (VHDX internal)
      - persona-data:/data
      # Isolated internal Codex credentials and session (VHDX internal)
      - persona-codex:/root/.codex
      # Shared named volume to access ComfyUI models & output
      - comfy-data:/comfy-data:rw
      # Modal Cloud CLI credentials
      - ${HOST_MODAL_CONFIG:-C:/Users/cloim/.modal.toml}:/root/.modal.toml:ro
    depends_on:
      comfyui:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8190/api/session || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  comfy-data:
    name: comfy-data
  comfymui-data:
    name: comfymui-data
  persona-data:
    name: persona-data
  persona-codex:
    name: persona-codex
