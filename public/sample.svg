<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 1024">
  <defs>
    <!-- Background cinematic lighting gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2623" />
      <stop offset="45%" stop-color="#2a332e" />
      <stop offset="100%" stop-color="#181e1b" />
    </linearGradient>
    <radialGradient id="rim-light" cx="65%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#ecd9b8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#b89d74" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#2a332e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="soft-glow" cx="35%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#fcedd9" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#2a332e" stop-opacity="0" />
    </radialGradient>
    <!-- Skin gradients -->
    <linearGradient id="skin" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#f8e5d6" />
      <stop offset="50%" stop-color="#eed5c3" />
      <stop offset="100%" stop-color="#d4b49f" />
    </linearGradient>
    <linearGradient id="skin-shadow" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%" stop-color="#cfad98" />
      <stop offset="100%" stop-color="#9f7b66" />
    </linearGradient>
    <linearGradient id="neck-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ba9580" />
      <stop offset="100%" stop-color="#e2c5b2" />
    </linearGradient>
    <!-- Hair gradients -->
    <linearGradient id="hair-main" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a2e28" />
      <stop offset="50%" stop-color="#241c19" />
      <stop offset="100%" stop-color="#15100e" />
    </linearGradient>
    <linearGradient id="hair-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c483e" />
      <stop offset="100%" stop-color="#2a201b" />
    </linearGradient>
    <!-- Clothing gradient -->
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#46544b" />
      <stop offset="60%" stop-color="#343e37" />
      <stop offset="100%" stop-color="#202722" />
    </linearGradient>
    <!-- Subtle grain filter -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.08" />
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply" />
    </filter>
  </defs>

  <!-- Background -->
  <g filter="url(#grain)">
    <rect width="768" height="1024" fill="url(#bg)" />
    <rect width="768" height="1024" fill="url(#rim-light)" />
    <rect width="768" height="1024" fill="url(#soft-glow)" />

    <!-- Ambient bokeh blur orbs -->
    <circle cx="160" cy="220" r="140" fill="#ecd9b8" opacity="0.06" filter="blur(30px)" />
    <circle cx="620" cy="380" r="180" fill="#a48c68" opacity="0.08" filter="blur(40px)" />
    <circle cx="540" cy="740" r="120" fill="#6c8273" opacity="0.07" filter="blur(35px)" />

    <!-- Hair Back Volume -->
    <path d="M220 380 C180 480 170 650 200 780 C240 850 310 880 340 880 C310 760 300 600 310 460 Z" fill="#15100e" />
    <path d="M520 360 C580 460 610 620 590 770 C560 840 500 870 470 870 C500 750 510 590 490 440 Z" fill="#1b1412" />

    <!-- Shoulders and Clothing -->
    <path d="M140 1024 L140 920 C140 830 220 780 300 760 L384 790 L468 760 C548 780 628 830 628 920 L628 1024 Z" fill="url(#cloth)" />
    <!-- Collarbone and neckline depth -->
    <path d="M320 760 Q384 810 448 760 Q384 775 320 760 Z" fill="#202722" opacity="0.6" />

    <!-- Neck and Chest -->
    <path d="M334 580 L334 760 Q384 790 434 760 L434 580 Z" fill="url(#skin)" />
    <path d="M334 580 Q384 620 434 580 L434 650 Q384 680 334 650 Z" fill="url(#neck-shadow)" opacity="0.55" />

    <!-- Face Base -->
    <!-- Center (384, 430) -->
    <path d="M276 360 C264 470 284 560 384 640 C484 560 504 470 492 360 C480 250 288 250 276 360 Z" fill="url(#skin)" />

    <!-- Facial Contouring / Soft Shadow (Left side softer, right side shaded) -->
    <path d="M420 340 C460 410 476 490 460 560 C436 600 404 624 384 636 C434 610 474 550 478 460 C482 390 458 340 420 340 Z" fill="url(#skin-shadow)" opacity="0.45" />

    <!-- Eyes and Eyebrows -->
    <!-- Left Brow -->
    <path d="M308 382 Q336 370 364 380" stroke="#33241d" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <!-- Right Brow -->
    <path d="M404 380 Q432 370 460 382" stroke="#33241d" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Left Eye -->
    <path d="M312 404 Q336 394 360 405" stroke="#241914" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M316 405 Q336 418 356 406" stroke="#5a3d31" stroke-width="1.8" fill="#fdfaf7" />
    <ellipse cx="336" cy="405" rx="7" ry="7" fill="#422f25" />
    <circle cx="337" cy="404" r="3.5" fill="#18110d" />
    <circle cx="334.5" cy="402" r="1.5" fill="#ffffff" />
    <path d="M310 403 Q336 390 362 404" stroke="#1d1410" stroke-width="2.5" fill="none" />

    <!-- Right Eye -->
    <path d="M408 405 Q432 394 456 404" stroke="#241914" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M412 406 Q432 418 452 405" stroke="#5a3d31" stroke-width="1.8" fill="#fdfaf7" />
    <ellipse cx="432" cy="405" rx="7" ry="7" fill="#422f25" />
    <circle cx="433" cy="404" r="3.5" fill="#18110d" />
    <circle cx="430.5" cy="402" r="1.5" fill="#ffffff" />
    <path d="M406 404 Q432 390 458 403" stroke="#1d1410" stroke-width="2.5" fill="none" />

    <!-- Nose -->
    <path d="M380 398 Q385 460 376 476 Q384 480 392 476" stroke="#b68f77" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <ellipse cx="384" cy="477" rx="9" ry="3.5" fill="#c49b82" opacity="0.5" />

    <!-- Lips -->
    <!-- Upper lip -->
    <path d="M356 525 Q372 518 384 522 Q396 518 412 525 Q384 528 356 525 Z" fill="#b96a66" />
    <!-- Lower lip -->
    <path d="M358 526 Q384 529 410 526 Q384 546 358 526 Z" fill="#cd7d77" />
    <!-- Lip center accent -->
    <path d="M362 525 Q384 527 406 525" stroke="#7e3b38" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Cheek Blush (Soft glow) -->
    <ellipse cx="320" cy="455" rx="28" ry="16" fill="#e59389" opacity="0.22" filter="blur(8px)" />
    <ellipse cx="448" cy="455" rx="28" ry="16" fill="#d97d72" opacity="0.2" filter="blur(8px)" />

    <!-- Elegant Hair Foreground Framing -->
    <!-- Crown Volume -->
    <path d="M260 340 C250 200 330 160 384 160 C450 160 520 200 510 340 C490 240 440 210 384 210 C320 210 280 240 260 340 Z" fill="url(#hair-light)" />
    <!-- Left Waves -->
    <path d="M276 290 C240 340 220 440 236 540 C248 620 280 700 290 760 C270 690 246 580 250 490 C254 420 270 350 290 300 Z" fill="url(#hair-main)" />
    <!-- Right Waves and Strands framing jawline -->
    <path d="M490 290 C530 350 546 460 534 560 C520 650 486 730 470 780 C492 700 516 600 512 510 C508 430 496 360 474 300 Z" fill="url(#hair-main)" />
    <path d="M330 190 Q370 240 300 320 Q350 230 330 190 Z" fill="#4d3b32" opacity="0.8" />
    <path d="M430 190 Q400 250 470 330 Q420 240 430 190 Z" fill="#523f36" opacity="0.8" />

    <!-- Cinematic lighting overlay & vignette edge -->
    <rect width="768" height="1024" fill="none" stroke="#2a332e" stroke-width="40" opacity="0.5" />
  </g>
</svg>
